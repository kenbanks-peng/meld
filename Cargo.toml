[package]
name = "meld"
version = "0.1.0"
edition = "2024"
description = "Mark Elements Down: render component-enhanced Markdown into standalone HTML"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
minijinja = { version = "2", features = ["loader"] }
pulldown-cmark = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.9"

[dev-dependencies]
tempfile = "3"
